<!DOCTYPE html>
<html>
<head>
    <title>Digit Recognition</title>
    <style>
        canvas { 
            border: 2px solid black;
            background-color: black;  /* Match MNIST's black background */
        }
        body { text-align: center; }
    </style>
</head>
<body>
    <h1>Draw a Digit</h1>
    <canvas id="canvas" width="280" height="280"></canvas>
    <br>
    <button onclick="clearCanvas()">Clear</button>
    <button onclick="predict()">Predict</button>
    <h2 id="prediction">Prediction: </h2>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Initialize canvas with black background
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 25;
        ctx.lineCap = 'round';

        // Handle both mouse and touch events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            isDrawing = true;
            const pos = getMousePos(canvas, e);
            [lastX, lastY] = [pos.x, pos.y];
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();  // Prevent scrolling on touch devices
            
            const pos = getMousePos(canvas, e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            
            [lastX, lastY] = [pos.x, pos.y];
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            if (evt.touches) {
                return {
                    x: evt.touches[0].clientX - rect.left,
                    y: evt.touches[0].clientY - rect.top
                };
            }
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }

        function clearCanvas() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('prediction').innerHTML = 'Prediction: ';
        }

        async function predict() {
            try {
                // Convert canvas to base64 image
                const image = canvas.toDataURL();  // Defaults to PNG
                
                // Send to server
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ image: image })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                if (result.error) {
                    throw new Error(result.error);
                }
                
                document.getElementById('prediction').innerHTML = 
                    `Prediction: ${result.prediction}`;
            } catch (error) {
                console.error('Prediction failed:', error);
                document.getElementById('prediction').innerHTML = 
                    `Error: ${error.message}`;
            }
        }

        // Optional: Add touch-action CSS to prevent scrolling on touch devices
        canvas.style.touchAction = 'none';  // Prevents default touch actions like scrolling
    </script>
</body>
</html>
